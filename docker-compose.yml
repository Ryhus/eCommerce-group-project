services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: sportgear
      POSTGRES_USER: sportgear
      POSTGRES_PASSWORD: sportgear
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sportgear -d sportgear"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: ["node", "node_modules/prisma/build/index.js", "migrate", "deploy", "--config", "backend/prisma.config.ts"]
    environment: &api-env
      DATABASE_URL: postgresql://sportgear:sportgear@db:5432/sportgear?schema=public
      JWT_ACCESS_SECRET: development-access-secret-change-me-000000
      COOKIE_SECRET: development-cookie-secret-change-me-000000
      FRONTEND_ORIGIN: http://localhost:8080
      PORT: 3000
    depends_on:
      db:
        condition: service_healthy

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment: *api-env
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        ["CMD", "node", "-e", "fetch('http://localhost:3000/api/v1/health/ready').then(r=>{if(!r.ok)process.exit(1)})"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "8080:80"
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres_data:
