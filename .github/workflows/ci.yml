name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: sportgear_test
          POSTGRES_USER: sportgear
          POSTGRES_PASSWORD: sportgear
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sportgear -d sportgear_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://sportgear:sportgear@localhost:5432/sportgear_test?schema=public
      JWT_ACCESS_SECRET: ci-access-secret-000000000000000000000
      COOKIE_SECRET: ci-cookie-secret-000000000000000000000
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run db:generate
      - run: npm run prisma:validate --workspace backend
      - run: npm run prisma:deploy --workspace backend
      - run: npm run db:seed
      - run: npm run format:check
      - run: npm run lint
      - run: npm test
      - run: npm run test:e2e
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:smoke
